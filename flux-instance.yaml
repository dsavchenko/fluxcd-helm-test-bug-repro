apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "1h"
    fluxcd.controlplane.io/reconcileArtifactEvery: "1m"
    fluxcd.controlplane.io/reconcileTimeout: "1m"
spec:
  distribution:
    version: "2.x"
    registry: "ghcr.io/fluxcd"
    artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
  cluster:
    type: kubernetes
    size: small
    multitenant: false
  sync:
    kind: GitRepository
    url: https://github.com/dsavchenko/fluxcd-helm-test-bug-repro.git
    ref: "refs/heads/main"
    path: ./apps
    pullSecret: gh-demo-token
  kustomize:
    patches:
      - patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --log-level=debug

        target:
          kind: Deployment
          name: "helm-controller"
